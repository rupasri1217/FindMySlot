<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FindMySlot - Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects direct URL hits to the appropriate hash route
      var pathSegmentsToKeep = 1; // Keep repository path segment (/FindMySlot-v1/)
      var l = window.location;
      var path = l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/");
      var repoPrefix = l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/");
      var redirectUrl =
        l.protocol +
        "//" +
        l.hostname +
        (l.port ? ":" + l.port : "") +
        repoPrefix +
        "/#" +
        (path ? "/" + path : "") +
        (l.search ? "?" + l.search.slice(1) : "");
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    <p>Redirecting to FindMySlot...</p>
  </body>
</html>
